# The public repository's test gate: the Python test suite on every pull request and on every push to test and
# main, in the environment a fresh clone gets from requirements.txt under constraints.txt. No engine build and no
# network are needed for these tests. The ruff job gates lint (E, F, S and B007 under pyproject.toml); formatting
# is not gated.
name: tests

on:
  pull_request:
  push:
    branches: [test, main]

permissions:
  contents: read

jobs:
  ruff:
    if: github.repository == 'taos-im/sn-79'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: python -m pip install "ruff==0.15.15"
      - name: Lint
        run: ruff check --no-cache .
  pytest:
    if: github.repository == 'taos-im/sn-79'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install "pytest==9.0.3" "pytest-asyncio==1.4.0"
      - name: Test
        run: python -m pytest -q -p no:cacheprovider tests
